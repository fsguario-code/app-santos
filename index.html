<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santos — História, Importância e Doutrina</title>
  
  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fdfbf7;
      --card: #ffffff;
      --text: #333333;
      --muted: #737373;
      --accent: #a65d3e;
      --accent-light: #f4ece8;
      --border: #eae5df;
      --whatsapp: #25D366;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 2rem 1rem;
      text-align: center;
    }
    header h1 { 
      margin: 0 0 0.25rem; 
      font-family: 'Lora', serif;
      font-size: 2rem; 
      color: var(--accent); 
    }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    
    /* Barra de Busca */
    #busca {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      margin: 1rem 0 2rem;
      background: var(--card);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      transition: all 0.2s;
    }
    #busca:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(166, 93, 62, 0.1);
    }

    /* Lista de Cards */
    #lista { display: grid; gap: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .card:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
      border-color: var(--accent-light);
    }
    .card-content { flex: 1; }
    .card h2 { 
      margin: 0 0 0.25rem; 
      font-family: 'Lora', serif;
      font-size: 1.25rem; 
      color: var(--accent); 
    }
    .card .dia { font-size: 0.85rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;}
    .card .frase { font-style: italic; font-size: 0.95rem; color: var(--muted); margin-top: 0.75rem; border-left: 2px solid var(--accent-light); padding-left: 0.75rem;}
    
    /* Imagem no card (se existir) */
    .card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg);
    }

    /* Tela de Detalhes */
    #detalhe { display: none; }
    #detalhe.ativo { display: block; }
    #lista.escondida { display: none; }
    .voltar {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.5rem 0;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .voltar:hover { text-decoration: underline; }
    
    .detalhe-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    
    .detalhe-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }
    .detalhe-header img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--accent-light);
    }
    
    .detalhe-card h2 { 
      margin: 0 0 0.25rem; 
      font-family: 'Lora', serif;
      font-size: 1.8rem;
      color: var(--accent); 
    }
    .detalhe-card .frase { 
      font-family: 'Lora', serif;
      font-style: italic; 
      font-size: 1.1rem;
      color: var(--muted); 
      border-left: 4px solid var(--accent); 
      padding-left: 1rem; 
      margin: 1.5rem 0; 
      background: var(--bg);
      padding: 1rem;
      border-radius: 0 8px 8px 0;
    }
    .detalhe-card h3 { 
      color: var(--accent); 
      font-size: 1.1rem; 
      margin-bottom: 0.25rem; 
      margin-top: 1.5rem;
    }
    .detalhe-card p { margin-top: 0; }
    
    /* Botão WhatsApp */
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--whatsapp);
      color: white;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 2rem;
      transition: opacity 0.2s;
      width: 100%;
    }
    .btn-whatsapp:hover { opacity: 0.9; }

    .fonte { font-size: 0.85rem; color: var(--muted); margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .vazio { text-align: center; color: var(--muted); padding: 3rem 0; font-size: 1.1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Vidas de Santos</h1>
    <p>História, importância e doutrina — breve e significativo</p>
  </header>

  <main>
    <input id="busca" type="search" placeholder="Buscar por nome, dia ou tema..." aria-label="Buscar santo" />

    <div id="lista"></div>

    <div id="detalhe">
      <button class="voltar" onclick="voltar()">← Voltar para a lista</button>
      <div id="detalhe-conteudo" class="detalhe-card"></div>
    </div>
  </main>

  <script>
    let santos = [];

    fetch('santos.json')
      .then(r => r.json())
      .then(data => {
        santos = data;
        renderLista(santos);
      })
      .catch(() => {
        document.getElementById('lista').innerHTML =
          '<p class="vazio">Não foi possível carregar os santos. Verifique o arquivo santos.json.</p>';
      });

    function renderLista(items) {
      const lista = document.getElementById('lista');
      if (!items.length) {
        lista.innerHTML = '<p class="vazio">Nenhum santo encontrado.</p>';
        return;
      }
      lista.innerHTML = items.map(s => `
        <div class="card" onclick="abrir('${s.id}')">
          ${s.imagem ? `<img src="${s.imagem}" alt="${s.nome}">` : ''}
          <div class="card-content">
            <h2>${s.nome}</h2>
            <div class="dia">${s.dia}</div>
            <div class="frase">"${s.frase}"</div>
          </div>
        </div>
      `).join('');
    }

    function abrir(id) {
      const s = santos.find(x => x.id === id);
      if (!s) return;
      
      // Prepara o texto para o WhatsApp
     const textoWhats = encodeURIComponent(`*${s.nome}* (${s.dia})\n\n_"${s.frase}"_\n\n*História:* ${s.historia}\n\n*Doutrina:* ${s.doutrina}\n\n_Fonte: ${s.fonte}._\nCompartilhado pelo app Vidas de Santos.`);
      const linkWhats = `https://api.whatsapp.com/send?text=${textoWhats}`;

      document.getElementById('detalhe-conteudo').innerHTML = `
        <div class="detalhe-header">
          ${s.imagem ? `<img src="${s.imagem}" alt="${s.nome}">` : ''}
          <div>
            <h2>${s.nome}</h2>
            <div class="dia">${s.dia}</div>
          </div>
        </div>
        
        <div class="frase">"${s.frase}"</div>
        
        <section>
          <h3>História</h3>
          <p>${s.historia}</p>
        </section>
        <section>
          <h3>Importância</h3>
          <p>${s.importancia}</p>
        </section>
        <section>
          <h3>Doutrina e ensinamento</h3>
          <p>${s.doutrina}</p>
        </section>
        
        <a href="${linkWhats}" target="_blank" class="btn-whatsapp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          Compartilhar no WhatsApp
        </a>

        <p class="fonte">Fonte: ${s.fonte}</p>
      `;
      
      document.getElementById('lista').classList.add('escondida');
      document.getElementById('busca').style.display = 'none';
      document.getElementById('detalhe').classList.add('ativo');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function voltar() {
      document.getElementById('detalhe').classList.remove('ativo');
      document.getElementById('lista').classList.remove('escondida');
      document.getElementById('busca').style.display = 'block';
    }

    document.getElementById('busca').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return renderLista(santos);
      const filtrados = santos.filter(s =>
        s.nome.toLowerCase().includes(q) ||
        s.dia.includes(q) ||
        s.importancia.toLowerCase().includes(q) ||
        s.doutrina.toLowerCase().includes(q) ||
        s.historia.toLowerCase().includes(q)
      );
      renderLista(filtrados);
    });
  </script>
</body>
</html>
