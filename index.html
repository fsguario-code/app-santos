<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santos — História, Importância e Doutrina</title>

  <!-- Fontes do Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #fbf6ec;
      --bg-deep: #f5ecd9;
      --card: #fffdf8;
      --text: #2b2622;
      --muted: #6b6157;
      --gold-300: #e6d3a3;
      --gold-400: #d4b979;
      --gold-500: #b8954f;
      --gold-700: #7a5a22;
      --accent: #7a5a22;
      --border: rgba(184, 149, 79, 0.22);
      --shadow-soft: 0 2px 6px rgba(74, 55, 20, 0.04), 0 12px 32px -12px rgba(74, 55, 20, 0.12);
      --shadow-hover: 0 4px 10px rgba(74, 55, 20, 0.06), 0 24px 48px -16px rgba(74, 55, 20, 0.22);
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --whatsapp: #25D366;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(rgba(184, 149, 79, 0.10) 1px, transparent 1px),
        radial-gradient(ellipse at top, #fffdf8 0%, transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      background-size: 22px 22px, 100% 100%, 100% 100%;
      background-attachment: fixed;
    }
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }
    .cruz {
      display: block;
      margin: 0 auto 0.75rem;
      color: var(--gold-500);
      opacity: 0.9;
    }
    header h1 {
      margin: 0 0 0.5rem;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      letter-spacing: 0.08em;
      line-height: 1.2;
      color: var(--gold-700);
    }
    header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .divisor {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 1.25rem auto 0;
      color: var(--gold-500);
    }
    .divisor span {
      display: block;
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-400));
    }
    .divisor span:last-child { transform: scaleX(-1); }
    .divisor i {
      width: 6px;
      height: 6px;
      transform: rotate(45deg);
      background: var(--gold-500);
    }
    main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    /* Barra de Busca */
    #busca {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      margin: 1rem 0 2rem;
      background: var(--card);
      box-shadow: var(--shadow-soft);
      transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    #busca::placeholder { color: var(--muted); }
    #busca:focus {
      outline: none;
      border-color: var(--gold-500);
      box-shadow: 0 0 0 4px rgba(184, 149, 79, 0.15), var(--shadow-soft);
    }

    /* Lista de Cards */
    #lista { display: grid; gap: 1.25rem; }
    .card {
      background: linear-gradient(180deg, #fffefb 0%, var(--card) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition:
        transform 0.5s var(--ease),
        box-shadow 0.5s var(--ease),
        border-color 0.5s var(--ease);
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--gold-400);
    }
    .card:hover .avatar { transform: scale(1.05); }
    .card:focus-visible {
      outline: 2px solid var(--gold-500);
      outline-offset: 3px;
    }
    .card-content { flex: 1; min-width: 0; }
    .card h2 {
      margin: 0 0 0.25rem;
      font-family: 'Lora', serif;
      font-size: 1.25rem;
      color: var(--gold-700);
    }
    .card .dia { font-size: 0.85rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .card .frase {
      font-style: italic;
      font-size: 0.95rem;
      color: var(--muted);
      margin-top: 0.75rem;
      border-left: 2px solid var(--gold-300);
      padding-left: 0.75rem;
    }

    /* Avatares: foto redonda ou inicial em círculo dourado */
    .avatar {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--gold-500);
      box-shadow: 0 0 0 4px var(--bg);
      transition: transform 0.5s var(--ease);
    }
    .avatar-inicial {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 2rem;
      color: var(--gold-700);
      background: radial-gradient(circle at 30% 30%, #fffdf8 0%, var(--gold-300) 100%);
    }
    .avatar-lg { width: 110px; height: 110px; }
    .avatar-lg.avatar-inicial { font-size: 2.8rem; }

    /* Tela de Detalhes */
    #detalhe { display: none; }
    #detalhe.ativo { display: block; }
    #lista.escondida { display: none; }
    .voltar {
      background: none;
      border: none;
      color: var(--gold-700);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.5rem 0;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .voltar:hover { color: var(--text); transform: translateX(-4px); }

    .detalhe-card {
      background: linear-gradient(180deg, #fffefb 0%, var(--card) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--shadow-soft);
    }

    .detalhe-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }

    .detalhe-card h2 {
      margin: 0 0 0.25rem;
      font-family: 'Lora', serif;
      font-size: 1.8rem;
      color: var(--gold-700);
    }
    .detalhe-card .frase {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 1.1rem;
      color: var(--muted);
      border-left: 4px solid var(--gold-500);
      margin: 1.5rem 0;
      background: var(--bg);
      padding: 1rem;
      border-radius: 0 10px 10px 0;
    }
    .detalhe-card h3 {
      color: var(--gold-700);
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
      margin-top: 1.5rem;
    }
    .detalhe-card p { margin-top: 0; }

    /* Botão WhatsApp */
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--whatsapp);
      color: #ffffff;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      margin-top: 2rem;
      transition: opacity 0.2s, transform 0.3s var(--ease);
      width: 100%;
    }
    .btn-whatsapp:hover { opacity: 0.92; transform: translateY(-2px); }

    .fonte { font-size: 0.85rem; color: var(--muted); margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .vazio { text-align: center; color: var(--muted); padding: 3rem 0; font-size: 1.1rem; }

    @media (max-width: 480px) {
      .card { padding: 1rem; gap: 1rem; }
      .avatar { width: 64px; height: 64px; }
      .avatar-inicial { font-size: 1.6rem; }
      .detalhe-card { padding: 1.25rem; }
      .detalhe-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <svg class="cruz" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M11 2h2v5h5v2h-5v13h-2V9H6V7h5z"/>
    </svg>
    <h1>Vidas de Santos</h1>
    <p>História, importância e doutrina — breve e significativo</p>
    <div class="divisor" aria-hidden="true"><span></span><i></i><span></span></div>
  </header>

  <main>
    <input id="busca" type="search" placeholder="Buscar por nome, dia ou tema..." aria-label="Buscar santo" />

    <div id="lista"></div>

    <div id="detalhe">
      <button class="voltar" onclick="voltar()">← Voltar para a lista</button>
      <div id="detalhe-conteudo" class="detalhe-card"></div>
    </div>
  </main>

  <script>
    let santos = [];

    fetch('santos.json')
      .then(r => r.json())
      .then(data => {
        santos = data;
        renderLista(santos);
      })
      .catch(() => {
        document.getElementById('lista').innerHTML =
          '<p class="vazio">Não foi possível carregar os santos. Verifique o arquivo santos.json.</p>';
      });

    const TITULOS = ['são', 'santo', 'santa', 'beato', 'beata', 'padre', 'irmã', 'dom'];

    function inicial(nome) {
      const palavra = nome.split(' ').find(p => !TITULOS.includes(p.toLowerCase())) || nome;
      return palavra.charAt(0).toUpperCase();
    }

    function avatar(s, classeExtra = '') {
      if (s.imagem) {
        return `<img class="avatar ${classeExtra}" src="${s.imagem}" alt="${s.nome}">`;
      }
      return `<div class="avatar avatar-inicial ${classeExtra}" aria-hidden="true">${inicial(s.nome)}</div>`;
    }

    function renderLista(items) {
      const lista = document.getElementById('lista');
      if (!items.length) {
        lista.innerHTML = '<p class="vazio">Nenhum santo encontrado.</p>';
        return;
      }
      lista.innerHTML = items.map(s => `
        <div class="card" tabindex="0" onclick="abrir('${s.id}')" onkeydown="if(event.key==='Enter')abrir('${s.id}')">
          ${avatar(s)}
          <div class="card-content">
            <h2>${s.nome}</h2>
            <div class="dia">${s.dia}</div>
            <div class="frase">"${s.frase}"</div>
          </div>
        </div>
      `).join('');
    }

    function abrir(id) {
      const s = santos.find(x => x.id === id);
      if (!s) return;

      // Prepara o texto para o WhatsApp
     const textoWhats = encodeURIComponent(`*${s.nome}* (${s.dia})\n\n_"${s.frase}"_\n\n*História:* ${s.historia}\n\n*Doutrina:* ${s.doutrina}\n\n_Fonte: ${s.fonte}._\nCompartilhado pelo app Vidas de Santos.`);
      const linkWhats = `https://api.whatsapp.com/send?text=${textoWhats}`;

      document.getElementById('detalhe-conteudo').innerHTML = `
        <div class="detalhe-header">
          ${avatar(s, 'avatar-lg')}
          <div>
            <h2>${s.nome}</h2>
            <div class="dia">${s.dia}</div>
          </div>
        </div>

        <div class="frase">"${s.frase}"</div>

        <section>
          <h3>História</h3>
          <p>${s.historia}</p>
        </section>
        <section>
          <h3>Importância</h3>
          <p>${s.importancia}</p>
        </section>
        <section>
          <h3>Doutrina e ensinamento</h3>
          <p>${s.doutrina}</p>
        </section>

        <a href="${linkWhats}" target="_blank" class="btn-whatsapp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          Compartilhar no WhatsApp
        </a>

        <p class="fonte">Fonte: ${s.fonte}</p>
      `;

      document.getElementById('lista').classList.add('escondida');
      document.getElementById('busca').style.display = 'none';
      document.getElementById('detalhe').classList.add('ativo');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function voltar() {
      document.getElementById('detalhe').classList.remove('ativo');
      document.getElementById('lista').classList.remove('escondida');
      document.getElementById('busca').style.display = 'block';
    }

    document.getElementById('busca').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return renderLista(santos);
      const filtrados = santos.filter(s =>
        s.nome.toLowerCase().includes(q) ||
        s.dia.includes(q) ||
        s.importancia.toLowerCase().includes(q) ||
        s.doutrina.toLowerCase().includes(q) ||
        s.historia.toLowerCase().includes(q)
      );
      renderLista(filtrados);
    });
  </script>
</body>
</html>
